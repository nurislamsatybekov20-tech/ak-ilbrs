<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ак-Ильбирс — Снежный Барс Кыргызстана</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .slide-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 20px;
            z-index: 1;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }
        .slide-img.active { opacity: 1; }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
            border-radius: 20px;
            z-index: 2;
        }
        .header {
            position: relative;
            z-index: 3;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0,242,254,0.5);
        }
        .footer {
            position: relative;
            z-index: 3;
            text-align: center;
        }
        .footer p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 15px;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: #00f2fe;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="slide-img active" src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=800&q=80" alt="Барс 1">
        <img class="slide-img" src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=800&q=80" alt="Барс 2">
        <img class="slide-img" src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=800&q=80" alt="Барс 3">
        
        <div class="overlay"></div>

        <div class="header">
            <h1>АК-ИЛЬБИРС</h1>
            <p style="font-size: 12px; opacity: 0.8;">Гордость Кыргызстана 🇰🇬</p>
        </div>

        <div class="footer">
            <p id="caption">Снежный барс — символ гор и свободы 🇰🇬</p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide-img');
        const progress = document.getElementById('progress');
        const captions = [
            "Снежный барс — символ гор и свободы 🇰🇬",
            "Обитатель высоких гор Тянь-Шаня 🏔️",
            "Национальное достояние Кыргызстана ❄️"
        ];
        const captionText = document.getElementById('caption');
        
        let currentIndex = 0;
        let step = 0;

        setInterval(() => {
            step += 2;
            progress.style.width = step + '%';

            if (step >= 100) {
                step = 0;
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
                captionText.innerText = captions[currentIndex];
            }
        }, 100);
    </script>
</body>
</html>
